<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Back of the Envelope Math — sizing and capacity calculators">
  <meta name="theme-color" content="#174f3d">
  <title>Back of the Envelope Math</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@450;600;750;850&display=swap" rel="stylesheet">
</head>
<body>
  <div class="shell">
    <div class="top-bar">
      <div class="brand">
        <span class="mark" aria-hidden="true">∑</span>
        <span>Back of the Envelope Math</span>
      </div>
    </div>

    <nav class="product-nav" id="productNav" aria-label="Calculator products"></nav>

    <header class="hero">
      <p class="eyebrow">Calculator suite</p>
      <h1>Back of the Envelope Math</h1>
      <p class="intro" id="productIntro">
        Paste a sample record, scale it across how many you’ll store, and layer on
        year-over-year growth to sketch storage before you write a single query.
      </p>
    </header>

    <h2 class="eyebrow" id="productTitle" style="position:absolute;left:-9999px">Sizing estimation</h2>
    <div id="calculatorHost"></div>
  </div>

  <template id="tpl-sizing">
    <div class="layout">
      <section class="panel controls" aria-labelledby="inputs-title">
        <p class="eyebrow">Inputs</p>
        <h2 id="inputs-title">Sizing estimation</h2>
        <p class="helper">UTF-8 byte size updates as you type. Multiplier and growth reshape the footprint in real time.</p>

        <div class="section">
          <label class="field-label" for="sampleText">Sample record / payload text</label>
          <textarea id="sampleText" spellcheck="false" placeholder='{"userId":"u_1842","event":"checkout"}'></textarea>
          <p class="helper" id="charMeta">0 characters · 0 UTF-8 bytes</p>
        </div>

        <div class="section">
          <span class="field-label" id="multiplierLabel">Record multiplier</span>
          <p class="helper">How many copies of this record will you store?</p>
          <div class="chips" id="multiplierChips" role="group" aria-labelledby="multiplierLabel"></div>
          <div class="custom-row">
            <div>
              <label class="field-label" for="customMultiplier">Custom count</label>
              <input id="customMultiplier" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 2500000">
            </div>
            <button type="button" class="apply" id="applyMultiplier">Use custom</button>
          </div>
        </div>

        <div class="section">
          <span class="field-label" id="growthLabel">YoY data growth</span>
          <p class="helper">Standard planning bars for large-scale systems — or enter your own percent.</p>
          <div class="chips" id="growthChips" role="group" aria-labelledby="growthLabel"></div>
          <p class="chip-hint" id="growthHint"></p>
          <div class="custom-row">
            <div>
              <label class="field-label" for="customGrowth">Custom growth (%)</label>
              <input id="customGrowth" type="number" min="0" step="0.1" inputmode="decimal" placeholder="e.g. 35">
            </div>
            <button type="button" class="apply" id="applyGrowth">Use custom</button>
          </div>
        </div>
      </section>

      <section class="panel results" aria-labelledby="results-title" aria-live="polite">
        <p class="eyebrow">Live estimate</p>
        <h2 id="results-title">Storage footprint</h2>

        <div class="hero-metric">
          <span class="label">Year 0 total</span>
          <span class="value" id="heroValue">0 bytes</span>
          <span class="sub" id="heroSub">0 records × 0 bytes each</span>
        </div>

        <div class="section">
          <h3>Per-record size</h3>
          <p class="helper">Units below 0.001 are hidden (no noise past three decimal zeros).</p>
          <div class="unit-grid" id="perRecordUnits"></div>
        </div>

        <div class="section">
          <h3>Scaled total (year 0)</h3>
          <div class="unit-grid" id="totalUnits"></div>
        </div>

        <div class="section">
          <h3>Five-year growth projection</h3>
          <p class="helper" id="projectionHelper">Compounded annually growth over five years.</p>
          <table class="projection">
            <thead>
              <tr>
                <th scope="col">Year</th>
                <th scope="col">Footprint</th>
                <th scope="col">vs year 0</th>
              </tr>
            </thead>
            <tbody id="projectionBody"></tbody>
          </table>
        </div>

        <p class="footnote">
          Sizing uses binary units (1 KB = 1024 bytes). Growth compounds on the year-0 footprint.
          Runs entirely in your browser — nothing is uploaded.
        </p>
      </section>
    </div>
  </template>

  <script type="module" src="/src/app.js"></script>
</body>
</html>

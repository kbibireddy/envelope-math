<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Back of the Envelope Math — sizing and capacity calculators for systems design">
  <meta name="theme-color" content="#0b1220">
  <title>Back of the Envelope Math</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@450;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="shell">
    <div class="top-bar">
      <div class="brand">
        <span class="mark" aria-hidden="true">∑</span>
        <span>Back of the Envelope Math</span>
      </div>
    </div>

    <div class="product-strip">
      <p class="product-intro" id="productIntro">
        Paste a sample record, scale storage, and layer YoY growth.
      </p>
      <nav class="product-nav" id="productNav" aria-label="Calculator products"></nav>
    </div>

    <h2 class="sr-only" id="productTitle">Sizing estimation</h2>
    <div id="calculatorHost"></div>
  </div>

  <template id="tpl-sizing">
    <div class="layout">
      <section class="panel controls" aria-labelledby="inputs-title">
        <p class="eyebrow">Inputs</p>
        <h2 id="inputs-title">Sizing estimation</h2>

        <div class="inputs-row">
          <div class="section sample-block">
            <label class="field-label" for="sampleText">Sample record / payload</label>
            <textarea id="sampleText" spellcheck="false" placeholder='{"userId":"u_1842","event":"checkout"}'></textarea>
            <div class="sample-toolbar">
              <p class="helper" id="charMeta" title="Characters and UTF-8 byte length">0 chars · 0 B</p>
              <div class="sample-fill">
                <span class="sample-fill-label" id="sampleFillLabel" title="Append random JSON-like text of about this size">≈ fill</span>
                <div
                  class="chips sample-fill-chips"
                  id="sampleFillChips"
                  role="group"
                  aria-labelledby="sampleFillLabel"
                ></div>
              </div>
            </div>
          </div>

          <div class="section compact scale-block">
            <div class="scale-stack">
              <div class="scale-row">
                <span class="field-label" id="multiplierLabel">Records</span>
                <div class="chips" id="multiplierChips" role="group" aria-labelledby="multiplierLabel"></div>
              </div>

              <div class="scale-row">
                <span class="field-label" id="growthLabel">YoY growth</span>
                <div class="chips" id="growthChips" role="group" aria-labelledby="growthLabel"></div>
              </div>

              <div class="scale-row">
                <span class="field-label" id="compressionLabel">Compression</span>
                <div class="chips compression-chips" id="compressionChips" role="group" aria-labelledby="compressionLabel"></div>
                <p class="helper" id="compressionMeta">Off · raw UTF-8 size</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel results" aria-labelledby="results-title" aria-live="polite">
        <p class="eyebrow">Estimate</p>
        <h2 id="results-title">Storage footprint</h2>

        <div class="footprint-panel section compact">
          <div class="footprint-head">
            <div class="footprint-summary">
              <p class="compare-label">Single record</p>
              <p class="compare-value">
                <span class="num" id="perRecordPrimaryValue">0</span>
                <span class="unit" id="perRecordPrimaryUnit">bytes</span>
              </p>
              <p class="compare-sub" id="perRecordSub">UTF-8 payload size</p>
            </div>
            <div class="footprint-summary footprint-summary-accent">
              <p class="compare-label">With multiplier</p>
              <p class="compare-value">
                <span class="num" id="totalPrimaryValue">0</span>
                <span class="unit" id="totalPrimaryUnit">bytes</span>
              </p>
              <p class="compare-sub" id="totalSub">0 records × 0 bytes each</p>
            </div>
          </div>

          <table class="footprint-table">
            <caption class="sr-only">Size by unit for one record and the scaled total</caption>
            <thead class="sr-only">
              <tr>
                <th scope="col">Single record</th>
                <th scope="col">With multiplier</th>
              </tr>
            </thead>
            <tbody id="unitTableBody"></tbody>
          </table>
        </div>

        <details class="section compact projection-block" open>
          <summary>Yearly footprint</summary>
          <p class="helper" id="projectionHelper"></p>
          <table class="projection">
            <thead>
              <tr>
                <th scope="col">Year</th>
                <th scope="col">Footprint</th>
                <th scope="col">× vs now</th>
              </tr>
            </thead>
            <tbody id="projectionBody"></tbody>
          </table>
          <button type="button" class="extend-btn" id="extendProjection">
            +5 years
          </button>
        </details>

        <table class="note-table">
          <caption class="sr-only">Sizing calculator notes</caption>
          <tbody>
            <tr><th scope="row">Units</th><td>Binary — 1 KB = 1024 bytes</td></tr>
            <tr><th scope="row">Ladder</th><td>Values &lt; 0.01 are dimmed</td></tr>
            <tr><th scope="row">Compression</th><td>Envelope for JSON/text — not codec benchmarks</td></tr>
            <tr><th scope="row">Growth</th><td>Compounds on year-0 footprint</td></tr>
            <tr><th scope="row">Privacy</th><td>Runs in-browser — nothing uploaded</td></tr>
          </tbody>
        </table>
      </section>
    </div>
  </template>

  <template id="tpl-throughput">
    <div class="layout">
      <section class="panel saved-layers-panel" id="savedLayersBlock" hidden aria-labelledby="savedLayersTitle">
        <div class="section-head">
          <div>
            <p class="eyebrow">Pinned</p>
            <h2 id="savedLayersTitle">Saved layers</h2>
          </div>
          <p class="helper" id="savedLayersHelper">Use these while sizing the next tier</p>
        </div>
        <div class="saved-layers" id="savedLayersList" role="list"></div>
      </section>

      <section class="panel controls" aria-labelledby="throughput-inputs-title">
        <p class="eyebrow">Inputs</p>
        <h2 id="throughput-inputs-title">Throughput estimation</h2>

        <div class="section compact">
          <div class="focus-bar">
            <span class="field-label" id="investigationLabel">Layer</span>
            <div
              class="mode-switch focus-switch"
              id="investigationChips"
              role="radiogroup"
              aria-labelledby="investigationLabel"
            ></div>
          </div>
          <p class="helper" id="investigationMeta">Choose a layer to size</p>
        </div>

        <div class="section compact" id="trafficBlock" hidden>
          <div class="scale-stack">
            <div class="traffic-row" id="audiencePeakRow">
              <div class="scale-row traffic-col" id="audienceBlock" hidden>
                <div class="traffic-col-head">
                  <span class="field-label" id="audienceModeLabel">Audience</span>
                  <div
                    class="mode-switch"
                    role="group"
                    aria-labelledby="audienceModeLabel"
                  >
                    <button type="button" class="mode-switch-btn" data-audience-mode="dau" aria-pressed="false">DAU</button>
                    <button type="button" class="mode-switch-btn" data-audience-mode="mau" aria-pressed="false">MAU</button>
                  </div>
                </div>
                <div class="chips" id="audienceChips" role="group" aria-label="Audience size"></div>
                <p class="helper" id="audienceMeta">1M DAU</p>
              </div>

              <div class="scale-row traffic-col" id="rateBlock" hidden>
                <span class="field-label" id="rateLabel">Avg RPS</span>
                <div class="chips" id="rateChips" role="group" aria-labelledby="rateLabel"></div>
                <p class="helper" id="rateMeta">Pick a suggested rate or enter your own</p>
              </div>

              <div class="scale-row traffic-col" id="peakBlock">
                <span class="field-label" id="peakLabel">Peak</span>
                <div class="chips" id="peakChips" role="group" aria-labelledby="peakLabel"></div>
                <p class="helper" id="peakMeta">Peak 3× over a flat average</p>
              </div>
            </div>
          </div>

          <div class="section-head">
            <h3 id="streamsLabel">Traffic streams</h3>
            <button type="button" class="text-btn" id="addStreamBtn">+ Custom</button>
          </div>
          <p class="helper" id="streamsHelper">Each stream is actions/user/day.</p>
          <div class="chips stream-template-chips" id="streamTemplates" role="group" aria-label="Add stream template"></div>
          <div class="stream-list" id="streamList"></div>
        </div>

        <div class="section compact" id="capacityBlock" hidden>
          <h3>Capacity check</h3>
          <p class="helper" id="capacityIntro">Systems for this investigation.</p>
          <span class="field-label" id="capacitySystemLabel">System</span>
          <div
            class="chips capacity-profile-chips"
            id="capacityProfileChips"
            role="group"
            aria-labelledby="capacitySystemLabel"
          ></div>

          <div class="capacity-grid">
            <label class="field-stack">
              <span class="field-label" for="payloadBytes">Payload bytes / request</span>
              <input id="payloadBytes" type="number" min="0" step="1" placeholder="e.g. 2048">
            </label>
            <label class="field-stack">
              <span class="field-label" for="nodeCapacityTps" id="nodeCapacityLabel">TPS per unit</span>
              <input id="nodeCapacityTps" type="number" min="0" step="1" placeholder="pick a system or enter">
            </label>
          </div>
          <p class="helper" id="capacityMeta">Pick a system to size this layer</p>
          <div class="capacity-guide" id="capacityGuide" hidden>
            <p class="capacity-guide-title" id="capacityGuideTitle"></p>
            <table class="note-table capacity-guide-table">
              <caption class="sr-only">Selected system capacity notes</caption>
              <tbody>
                <tr>
                  <th scope="row">Limits</th>
                  <td id="capacityGuideLimits"></td>
                </tr>
                <tr>
                  <th scope="row">Connections</th>
                  <td id="capacityGuideConnections"></td>
                </tr>
                <tr>
                  <th scope="row">Tip</th>
                  <td id="capacityGuideTip"></td>
                </tr>
                <tr>
                  <th scope="row">Your TPS/unit</th>
                  <td class="capacity-guide-assess" id="capacityGuideAssess"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="panel results" aria-labelledby="throughput-results-title" aria-live="polite">
        <div class="section-head results-head">
          <div>
            <p class="eyebrow">Estimate</p>
            <h2 id="throughput-results-title">Request throughput</h2>
          </div>
          <button type="button" class="save-layer-btn" id="saveLayerBtn" hidden>
            Save this layer
          </button>
        </div>

        <div class="footprint-panel section compact">
          <div class="footprint-head">
            <div class="footprint-summary">
              <p class="compare-label">Avg TPS</p>
              <p class="compare-value">
                <span class="num" id="totalAvgTps">0</span>
                <span class="unit">TPS</span>
              </p>
              <p class="compare-sub">Flat average across streams</p>
            </div>
            <div class="footprint-summary footprint-summary-accent">
              <p class="compare-label">Peak TPS</p>
              <p class="compare-value">
                <span class="num" id="totalPeakTps">0</span>
                <span class="unit">TPS</span>
              </p>
              <p class="compare-sub" id="throughputSummary">—</p>
            </div>
          </div>

          <table class="footprint-table stream-table">
            <caption class="sr-only">Per-stream average and peak TPS</caption>
            <thead>
              <tr>
                <th scope="col">Stream</th>
                <th scope="col" id="streamRateColumn">Actions/user/day</th>
                <th scope="col">Avg TPS</th>
                <th scope="col">Peak TPS</th>
                <th scope="col">Share</th>
              </tr>
            </thead>
            <tbody id="streamTableBody"></tbody>
          </table>
        </div>

        <div class="section compact capacity-results">
          <div class="capacity-stats">
            <div>
              <p class="compare-label">Avg bandwidth</p>
              <p class="compare-value small"><span id="bandwidthAvg">—</span></p>
            </div>
            <div>
              <p class="compare-label">Peak bandwidth</p>
              <p class="compare-value small"><span id="bandwidthPeak">—</span></p>
            </div>
            <div>
              <p class="compare-label" id="nodesNeededLabel">Nodes @ peak</p>
              <p class="compare-value small"><span id="nodesNeeded">—</span></p>
            </div>
          </div>
        </div>

        <table class="note-table" id="throughputFootnote">
          <caption class="sr-only">Throughput calculator notes</caption>
          <tbody>
            <tr><th scope="row">Traffic math</th><td id="footnoteTraffic">Pick a layer to begin</td></tr>
            <tr><th scope="row">Peak</th><td id="footnotePeak">avg TPS × peak multiplier</td></tr>
            <tr><th scope="row">Privacy</th><td>Runs in-browser — nothing uploaded</td></tr>
          </tbody>
        </table>
      </section>
    </div>
  </template>


  <template id="tpl-reference">
    <div class="layout reference-layout">
      <section class="panel results reference-panel" aria-labelledby="reference-title">
        <p class="eyebrow">Cheat sheet</p>
        <h2 id="reference-title">Back-of-the-envelope reference</h2>
        <p class="helper reference-lede">
          Numbers every systems interview uses — verified against
          <a href="https://bytebytego.com/courses/system-design-interview/back-of-the-envelope-estimation" rel="noopener noreferrer" target="_blank">ByteByteGo’s estimation chapter</a>
          (Dean / High Scalability lineage). Order-of-magnitude aids, not lab benchmarks.
        </p>

        <div class="reference-grid">
          <section class="reference-card" aria-labelledby="powerTitle">
            <h3 id="powerTitle">Power of two</h3>
            <table class="note-table">
              <thead>
                <tr>
                  <th scope="col">Power</th>
                  <th scope="col">≈ value</th>
                  <th scope="col">Name</th>
                  <th scope="col">Short</th>
                </tr>
              </thead>
              <tbody id="powerOfTwoBody"></tbody>
            </table>
          </section>

          <section class="reference-card" aria-labelledby="timeTitle">
            <h3 id="timeTitle">Time units</h3>
            <table class="note-table">
              <thead>
                <tr>
                  <th scope="col">Unit</th>
                  <th scope="col">Equals</th>
                </tr>
              </thead>
              <tbody id="timeUnitsBody"></tbody>
            </table>
          </section>

          <section class="reference-card reference-card-wide" aria-labelledby="latencyTitle">
            <h3 id="latencyTitle">Latency numbers</h3>
            <table class="note-table">
              <thead>
                <tr>
                  <th scope="col">Operation</th>
                  <th scope="col">Time</th>
                </tr>
              </thead>
              <tbody id="latencyBody"></tbody>
            </table>
            <table class="note-table reference-subtable">
              <caption class="sr-only">Latency takeaways</caption>
              <thead>
                <tr><th scope="col">Takeaway</th></tr>
              </thead>
              <tbody id="latencyTakeawaysBody"></tbody>
            </table>
          </section>

          <section class="reference-card reference-card-wide" aria-labelledby="availTitle">
            <h3 id="availTitle">Availability (nines)</h3>
            <table class="note-table">
              <thead>
                <tr>
                  <th scope="col">Availability</th>
                  <th scope="col">/ day</th>
                  <th scope="col">/ month</th>
                  <th scope="col">/ year</th>
                </tr>
              </thead>
              <tbody id="availabilityBody"></tbody>
            </table>
          </section>

          <section class="reference-card reference-card-wide" aria-labelledby="formulaTitle">
            <h3 id="formulaTitle">Common formulas</h3>
            <table class="note-table">
              <thead>
                <tr>
                  <th scope="col">Estimate</th>
                  <th scope="col">Formula</th>
                </tr>
              </thead>
              <tbody id="formulasBody"></tbody>
            </table>
          </section>

          <section class="reference-card" aria-labelledby="tipsTitle">
            <h3 id="tipsTitle">Estimation tips</h3>
            <table class="note-table">
              <thead>
                <tr>
                  <th scope="col">Tip</th>
                  <th scope="col">Why</th>
                </tr>
              </thead>
              <tbody id="tipsBody"></tbody>
            </table>
          </section>

          <section class="reference-card" aria-labelledby="exampleTitle">
            <h3 id="exampleTitle">Worked example (Twitter-style)</h3>
            <table class="note-table">
              <thead>
                <tr>
                  <th scope="col">Step</th>
                  <th scope="col">Envelope</th>
                </tr>
              </thead>
              <tbody id="workedExampleBody"></tbody>
            </table>
          </section>
        </div>

        <table class="note-table reference-source">
          <caption class="sr-only">Sources</caption>
          <tbody>
            <tr>
              <th scope="row">Primary</th>
              <td>ByteByteGo — Back-of-the-envelope estimation</td>
            </tr>
            <tr>
              <th scope="row">Also</th>
              <td>Jeff Dean / High Scalability · interactive latency numbers (Colin Scott)</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </template>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
